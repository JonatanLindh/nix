[package]
name = "shell"
version = "0.1.0"
edition = "2024"

[dependencies]
# GPUI with gpui-base and gpui-component, used as `gpui` (see main.rs). The icons are our own,
# so not its Lucide assets.
gpui-kit = { version = "=0.9.0", default-features = false, features = ["component"] }
anyhow = "1"
env_logger = "0.11"
uuid = { version = "1", features = ["v5"] }
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
raw-window-handle = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "process", "sync", "macros", "signal", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
futures = "0.3"
zbus = "5"
logind-zbus = "5"
nmrs = "3"
bluer = { version = "0.17", features = ["bluetoothd"] }
system-tray = "0.8"
freedesktop-icons = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
ureq = "3"
# PipeWire for the sound service, through src/services/wirehose (ported from wiremix).
libspa = "0.9.2"
libspa-sys = "0.9.2"
nix = { version = "0.29", features = ["event"] }
wayland-protocols-hyprland = { version = "1.2.0", features = ["client"] }
# PipeWire: the sound service (src/services/wirehose) and the privacy indicators.
pipewire = "0.9"
clap = { version = "4.6.7", features = ["derive"] }
# The launcher's file search (fd's walker) and fuzzy ranking.
ignore = "0.4"
nucleo-matcher = "0.3"
# The shelf: QR codes for shares, and noticing items whose file went away.
qrcode = { version = "0.14", default-features = false }
inotify = "0.11.5"
rrule = "0.14.0"
sha2 = "0.10"
zeroize = "1.9.1"
chrono-tz = "0.10"

# gpui-pre with patches/ applied by devenv (see devenv.nix).
[patch.crates-io]
gpui-pre = { path = ".patched/gpui-pre" }
gpui-pre-linux = { path = ".patched/gpui-pre-linux" }
